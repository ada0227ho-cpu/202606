<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>6 Card AR Stable</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body { margin:0; overflow:hidden; }
</style>
</head>

<body>

<a-scene mindar-image="imageTargetSrc: targets.mind; autoStart:true; uiScanning:true;">

<a-assets>
<img id="card1" src="card1.jpg">
<img id="card2" src="card2.jpg">
<img id="card3" src="card3.jpg">
<img id="card4" src="card4.jpg">
<img id="card5" src="card5.jpg">
<img id="card6" src="card6.jpg">
</a-assets>

<a-camera look-controls="enabled:false"></a-camera>

<!-- IMG_1 -->
<a-entity mindar-image-target="targetIndex:0">
<a-plane src="#card1" width="1.2" height="0.7" touch-zoom></a-plane>
</a-entity>

<!-- IMG_2 -->
<a-entity mindar-image-target="targetIndex:1">
<a-plane src="#card2" width="1.2" height="0.7" touch-zoom></a-plane>
</a-entity>

<!-- IMG_3 -->
<a-entity mindar-image-target="targetIndex:2">
<a-plane src="#card3" width="1.2" height="0.7" touch-zoom></a-plane>
</a-entity>

<!-- IMG_4 -->
<a-entity mindar-image-target="targetIndex:3">
<a-plane src="#card4" width="1.2" height="0.7" touch-zoom></a-plane>
</a-entity>

<!-- IMG_5 -->
<a-entity mindar-image-target="targetIndex:4">
<a-plane src="#card5" width="1.2" height="0.7" touch-zoom></a-plane>
</a-entity>

<!-- IMG_6 -->
<a-entity mindar-image-target="targetIndex:5">
<a-plane src="#card6" width="1.2" height="0.7" touch-zoom></a-plane>
</a-entity>

</a-scene>

<script>
AFRAME.registerComponent('touch-zoom', {
init:function(){
const el=this.el;
this.scale=1;
this.rot=0;
this.startD=null;
this.startA=null;

const c=document.querySelector('canvas');

// 雙指開始
c.addEventListener('touchstart',e=>{
if(e.touches.length==2){
let dx=e.touches[0].clientX-e.touches[1].clientX;
let dy=e.touches[0].clientY-e.touches[1].clientY;
this.startD=Math.hypot(dx,dy);
this.startA=Math.atan2(dy,dx);
}
});

// 雙指操作
c.addEventListener('touchmove',e=>{
if(e.touches.length==2 && this.startD){
let dx=e.touches[0].clientX-e.touches[1].clientX;
let dy=e.touches[0].clientY-e.touches[1].clientY;

let d=Math.hypot(dx,dy);
let a=Math.atan2(dy,dx);

let s=d/this.startD;
this.scale=Math.min(Math.max(this.scale*s,0.5),3);

el.object3D.scale.set(this.scale,this.scale,this.scale);

this.rot+=a-this.startA;
el.object3D.rotation.z=this.rot;

this.startD=d;
this.startA=a;

e.preventDefault();
}
},{passive:false});

// 雙擊重置
let t=0;
c.addEventListener('touchend',()=>{
let now=Date.now();
if(now-t<300){
this.scale=1;
this.rot=0;
el.object3D.scale.set(1,1,1);
el.object3D.rotation.set(0,0,0);
}
t=now;
});
}
});
</script>

</body>
</html>
