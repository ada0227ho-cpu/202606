<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MindAR AR Card</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body { margin:0; overflow:hidden; }
</style>
</head>

<body>

<a-scene mindar-image="imageTargetSrc: targets1.mind; autoStart: true; uiScanning: true;">

<a-assets>
  <img id="card" src="card1.jpg">
</a-assets>

<a-camera look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex: 0">

  <a-plane
    id="cardPlane"
    src="#card"
    width="1.2"
    height="0.7"
    position="0 0 0"
    touch-gesture>
  </a-plane>

</a-entity>

</a-scene>

<script>
AFRAME.registerComponent('touch-gesture', {
  init: function () {
    const el = this.el;

    this.scale = 1;
    this.rotationZ = 0;

    this.startDistance = null;
    this.startAngle = null;

    const canvas = el.sceneEl.canvas;

    // 雙指開始
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;

        this.startDistance = Math.hypot(dx, dy);
        this.startAngle = Math.atan2(dy, dx);
      }
    });

    // 雙指移動（縮放 + 旋轉）
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && this.startDistance !== null) {

        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;

        const distance = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);

        // 🔥 縮放
        const scaleChange = distance / this.startDistance;
        this.scale *= scaleChange;
        this.scale = Math.min(Math.max(this.scale, 0.5), 3);

        el.object3D.scale.set(this.scale, this.scale, this.scale);

        // 🔥 旋轉
        const angleChange = angle - this.startAngle;
        this.rotationZ += angleChange;

        el.object3D.rotation.z = this.rotationZ;

        this.startDistance = distance;
        this.startAngle = angle;

        e.preventDefault();
      }
    }, { passive: false });

    // 雙擊重置
    let lastTap = 0;

    canvas.addEventListener('touchend', () => {
      const now = Date.now();

      if (now - lastTap < 300) {
        this.scale = 1;
        this.rotationZ = 0;

        el.object3D.scale.set(1,1,1);
        el.object3D.rotation.set(0,0,0);
      }

      lastTap = now;
    });
  }
});
</script>

</body>
</html>
</html>
