<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR 1</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>body{margin:0;overflow:hidden;}</style>
</head>

<body>

<a-scene mindar-image="imageTargetSrc: targets1.mind; autoStart:true;">

<a-assets>
<img id="card" src="card1.jpg">
</a-assets>

<a-camera look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0">
<a-plane src="#card" width="1.2" height="0.7" touch-zoom></a-plane>
</a-entity>

</a-scene>

<script>
AFRAME.registerComponent('touch-zoom', {
init:function(){
const el=this.el;
this.scale=1;
this.rot=0;
this.startD=null;
this.startA=null;
const c=el.sceneEl.canvas;

c.addEventListener('touchstart',e=>{
if(e.touches.length==2){
let dx=e.touches[0].clientX-e.touches[1].clientX;
let dy=e.touches[0].clientY-e.touches[1].clientY;
this.startD=Math.hypot(dx,dy);
this.startA=Math.atan2(dy,dx);
}
});

c.addEventListener('touchmove',e=>{
if(e.touches.length==2&&this.startD){
let dx=e.touches[0].clientX-e.touches[1].clientX;
let dy=e.touches[0].clientY-e.touches[1].clientY;
let d=Math.hypot(dx,dy);
let a=Math.atan2(dy,dx);

let s=d/this.startD;
this.scale=Math.min(Math.max(this.scale*s,0.5),3);
el.object3D.scale.set(this.scale,this.scale,this.scale);

this.rot+=a-this.startA;
el.object3D.rotation.z=this.rot;

this.startD=d;
this.startA=a;
e.preventDefault();
}
},{passive:false});

let t=0;
c.addEventListener('touchend',()=>{
let n=Date.now();
if(n-t<300){
this.scale=1;
this.rot=0;
el.object3D.scale.set(1,1,1);
el.object3D.rotation.set(0,0,0);
}
t=n;
});
}
});
</script>

</body>
</html>
